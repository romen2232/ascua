[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "django>=5.2,<5.3",
    "django-axes>=9.0.0",
    "django-cors-headers>=4.9.0",
    "django-otp>=1.7.5",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "factory-boy>=3.3.3",
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "polib>=1.2.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
    "time-machine>=3.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
"config/settings/*" = ["S105"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["corsheaders.*", "django_otp.*", "axes.*", "rest_framework_simplejwt.*", "drf_spectacular.*", "factory.*", "polib.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "--strict-markers -p no:cacheprovider"
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["shared_kernel", "identity"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain and application are framework-free"
type = "forbidden"
source_modules = [
    "shared_kernel.domain",
    "shared_kernel.application",
    "identity.domain",
    "identity.application",
]
forbidden_modules = ["django", "rest_framework", "celery"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Context layers"
type = "layers"
containers = ["identity", "shared_kernel"]
layers = ["api", "infrastructure", "application", "domain"]
